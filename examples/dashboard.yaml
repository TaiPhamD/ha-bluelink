# Paste into a Manual card. Replace the sample entity IDs with yours from
# Settings > Devices & services > Bluelink Climate Control > your vehicle.
# Existing climate entities keep their previous IDs after upgrading.
type: vertical-stack
cards:
  - type: tile
    entity: climate.ioniq_5_climate_control
    name: Climate reported by Hyundai
    icon_tap_action:
      action: more-info
    features:
      - type: target-temperature
      - type: climate-hvac-modes
        hvac_modes:
          - heat_cool
          - "off"
  - type: markdown
    content: >-
      Temperature changes apply to the **next start**.
      {% set error = state_attr('sensor.ioniq_5_last_climate_command', 'error') %}
      {% if error %}

      **Last command:** {{ error }}
      {% endif %}
  - type: entities
    title: Hyundai feedback
    show_header_toggle: false
    entities:
      - entity: sensor.ioniq_5_last_climate_command
      - entity: sensor.ioniq_5_vehicle_feedback
      - entity: sensor.ioniq_5_vehicle_last_updated
      - entity: sensor.ioniq_5_vehicle_battery
      - entity: binary_sensor.ioniq_5_charging
      - entity: binary_sensor.ioniq_5_defrost
      - entity: sensor.ioniq_5_reported_climate_target
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.ioniq_5_next_command_available
        state_not:
          - unknown
          - unavailable
    card:
      type: tile
      entity: sensor.ioniq_5_next_command_available
      name: Command cooldown ends
      time_format: relative
      icon_tap_action:
        action: more-info
  - type: horizontal-stack
    cards:
      - type: button
        name: Check Hyundai cache
        entity: button.ioniq_5_refresh_cached_status
        icon: mdi:cloud-refresh
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ioniq_5_refresh_cached_status
      - type: button
        name: Request update from car
        entity: button.ioniq_5_request_fresh_vehicle_status
        icon: mdi:car-connected
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ioniq_5_request_fresh_vehicle_status
